<!DOCTYPE html>

<head>

<title>Brotherhood · Войти</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Space+Mono:wght@400;700&display=swap');
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:#0a0a0a;
    color:#e8e0d0;
    font-family:'Space Mono',monospace;
    min-height:100vh;
    display:flex;

  .line { width:1px; height:40px; background:linear-gradient(to bottom,#c9a84c,transparent); margin:0 auto 48px; }
  .label { font-size:8px; letter-spacing:3px; color:#555; text-transform:uppercase; margin-bottom:24px; }
  .tg-widget { margin-bottom:16px; }
  .note { font-size:9px; color:#333; letter-spacing:1px; margin-top:32px; }

</head>
<body>
  <div class="kanji">武道 · 兄弟 · 修行 · 道</div>

<script>

  async function onTelegramAuth(user) {

      method: 'POST',

        'Authorization': 'Bearer ' + SUPABASE_KEY,

        'Prefer': 'resolution=merge-duplicates'

        telegram_id: String(user.id),
        nickname: user.username || user.first_name,

    localStorage.setItem('bh_telegram_id', user.id);
